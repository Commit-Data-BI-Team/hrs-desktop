name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to retry without moving it
        required: true
        type: string

# Manual mode is an explicit repository setting until a Developer ID certificate
# is available. It publishes installers, never macOS updater metadata.
env:
  HRS_RELEASE_MODE: ${{ vars.HRS_RELEASE_MODE || 'signed' }}
  HRS_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            command: dist:mac:arm64
          - arch: x64
            runner: macos-15-intel
            command: dist:mac:x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HRS_RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: |
          if [[ "$HRS_RELEASE_MODE" == 'manual' ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          bash scripts/build-mac-ci.sh '${{ matrix.command }}'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          HRS_REQUIRE_MAC_SIGNING: ${{ vars.HRS_RELEASE_MODE == 'manual' && '0' || '1' }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/latest-mac.yml

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HRS_RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run dist:win:x64 -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-win]
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HRS_RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: release-mac-arm64
          path: dist-assets/release-mac-arm64
      - uses: actions/download-artifact@v4
        with:
          name: release-mac-x64
          path: dist-assets/release-mac-x64
      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: dist-assets/release-win
      - name: Prepare release files
        run: |
          set -euo pipefail
          if [[ ! "$HRS_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a deliberate version tag such as v1.0.20, got $HRS_RELEASE_TAG" >&2
            exit 1
          fi
          VERSION="${HRS_RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $HRS_RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [[ "$HRS_RELEASE_MODE" != 'manual' && "$HRS_RELEASE_MODE" != 'signed' ]]; then
            echo "Unknown HRS_RELEASE_MODE: $HRS_RELEASE_MODE" >&2
            exit 1
          fi
          mkdir -p release-files

          cp "dist-assets/release-mac-arm64/HRS Desktop-${VERSION}-arm64.dmg" "release-files/HRS-Desktop-${VERSION}-arm64.dmg"
          cp "dist-assets/release-mac-x64/HRS Desktop-${VERSION}.dmg" "release-files/HRS-Desktop-${VERSION}.dmg"
          if [[ "$HRS_RELEASE_MODE" == 'signed' ]]; then
            cp "dist-assets/release-mac-arm64/HRS Desktop-${VERSION}-arm64-mac.zip" "release-files/HRS-Desktop-${VERSION}-arm64-mac.zip"
            cp "dist-assets/release-mac-x64/HRS Desktop-${VERSION}-mac.zip" "release-files/HRS-Desktop-${VERSION}-mac.zip"
            node scripts/merge-latest-mac-yml.mjs \
              "dist-assets/release-mac-arm64/latest-mac.yml" \
              "dist-assets/release-mac-x64/latest-mac.yml" \
              "release-files/latest-mac.yml"
          fi

          cp "dist-assets/release-win/HRS Desktop Setup ${VERSION}.exe" "release-files/HRS-Desktop-Setup-${VERSION}.exe"
          if [[ "$HRS_RELEASE_MODE" == 'signed' && -f "dist-assets/release-win/HRS Desktop Setup ${VERSION}.exe.blockmap" ]]; then
            cp "dist-assets/release-win/HRS Desktop Setup ${VERSION}.exe.blockmap" "release-files/HRS-Desktop-Setup-${VERSION}.exe.blockmap"
          fi
          if [[ -f "dist-assets/release-win/HRS Desktop-${VERSION}-portable.exe" ]]; then
            cp "dist-assets/release-win/HRS Desktop-${VERSION}-portable.exe" "release-files/HRS-Desktop-${VERSION}-portable.exe"
          fi
          if [[ "$HRS_RELEASE_MODE" == 'signed' ]]; then
            cp "dist-assets/release-win/latest.yml" "release-files/latest.yml"
          fi
          if [[ -f CHANGELOG.md ]]; then
            awk "/^## ${VERSION}$/{flag=1; print; next} /^## /{flag=0} flag" CHANGELOG.md > "release-files/CHANGELOG-${VERSION}.md"
          fi
          if [[ -f "docs/HRS-Desktop-${VERSION}-Hebrew-Guide.docx" ]]; then
            cp "docs/HRS-Desktop-${VERSION}-Hebrew-Guide.docx" "release-files/HRS-Desktop-${VERSION}-Hebrew-Guide.docx"
          fi

          (cd release-files && sha256sum ./* > "SHA256SUMS-${VERSION}.txt")

          ls -lah release-files
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${HRS_RELEASE_TAG#v}"
          CHANGELOG_FILE="release-files/CHANGELOG-${VERSION}.md"
          NOTES_FILE="release-notes-${VERSION}.md"
          if [[ "$HRS_RELEASE_MODE" == 'manual' ]]; then
            printf 'Manual installation only. macOS in-app automatic updates are not available for this release. Download the DMG for your Mac and replace the installed app manually.\n\n' > "$NOTES_FILE"
          else
            : > "$NOTES_FILE"
          fi
          if [[ -s "$CHANGELOG_FILE" ]]; then
            cat "$CHANGELOG_FILE" >> "$NOTES_FILE"
          else
            printf "## %s\n\n- Automated release.\n" "$HRS_RELEASE_TAG" >> "$NOTES_FILE"
          fi
          if ! gh release view "$HRS_RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            TITLE="$HRS_RELEASE_TAG"
            CREATE_FLAGS=(--draft --verify-tag)
            if [[ "$HRS_RELEASE_MODE" == 'manual' ]]; then
              TITLE="$HRS_RELEASE_TAG (manual install)"
              CREATE_FLAGS+=(--latest=false)
            fi
            gh release create "$HRS_RELEASE_TAG" -R "$GH_REPO" --title "$TITLE" --notes-file "$NOTES_FILE" "${CREATE_FLAGS[@]}"
          fi
          gh release edit "$HRS_RELEASE_TAG" -R "$GH_REPO" --notes-file "$NOTES_FILE"
      - name: Keep only required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${HRS_RELEASE_TAG#v}"
          ALLOWED=(
            "HRS-Desktop-${VERSION}-arm64.dmg"
            "HRS-Desktop-${VERSION}.dmg"
            "HRS-Desktop-Setup-${VERSION}.exe"
            "HRS-Desktop-${VERSION}-portable.exe"
            "CHANGELOG-${VERSION}.md"
            "HRS-Desktop-${VERSION}-Hebrew-Guide.docx"
            "SHA256SUMS-${VERSION}.txt"
          )
          if [[ "$HRS_RELEASE_MODE" == 'signed' ]]; then
            ALLOWED+=(
              "HRS-Desktop-Setup-${VERSION}.exe.blockmap"
              "HRS-Desktop-${VERSION}-arm64-mac.zip"
              "HRS-Desktop-${VERSION}-mac.zip"
              "latest-mac.yml"
              "latest.yml"
            )
          fi
          mapfile -t CURRENT < <(gh release view "$HRS_RELEASE_TAG" -R "$GH_REPO" --json assets -q '.assets[].name')
          for name in "${CURRENT[@]}"; do
            keep=0
            for allowed in "${ALLOWED[@]}"; do
              if [[ "$name" == "$allowed" ]]; then
                keep=1
                break
              fi
            done
            if [[ $keep -eq 0 ]]; then
              gh release delete-asset "$HRS_RELEASE_TAG" "$name" -R "$GH_REPO" -y
            fi
          done
      - name: Upload required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$HRS_RELEASE_TAG" release-files/* -R "$GH_REPO" --clobber
          mapfile -t VERIFIED < <(gh release view "$HRS_RELEASE_TAG" -R "$GH_REPO" --json assets -q '.assets[] | select(.size > 0) | .name')
          for file in release-files/*; do
            name="${file##*/}"
            if ! printf '%s\n' "${VERIFIED[@]}" | grep -Fxq "$name"; then
              echo "Release asset missing or empty: $name" >&2
              exit 1
            fi
          done
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$HRS_RELEASE_TAG" -R "$GH_REPO" --draft=false
          if [[ "$HRS_RELEASE_MODE" == 'manual' ]]; then
            RELEASE_ID="$(gh release view "$HRS_RELEASE_TAG" -R "$GH_REPO" --json databaseId -q .databaseId)"
            gh api -X PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -f make_latest=false >/dev/null
            LATEST_TAG="$(gh api "repos/${GH_REPO}/releases/latest" -q .tag_name)"
            if [[ "$LATEST_TAG" == "$HRS_RELEASE_TAG" ]]; then
              echo 'Manual-only release must not become Latest for in-app updates.' >&2
              exit 1
            fi
          fi
