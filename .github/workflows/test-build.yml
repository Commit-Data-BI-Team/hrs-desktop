name: Test Build

# This workflow tests builds on every push/PR without creating releases
# Useful for testing before creating a release

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master

jobs:
  test-build-macos:
    name: Test macOS Build
    runs-on: macos-latest
    
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build React app
        run: npm run build
      
      - name: 🍎 Build macOS (Apple Silicon only for speed)
        run: npm run dist:mac:arm64 -- --publish never
      
      - name: ✅ Verify output
        run: |
          if [ ! -f dist/*.dmg ]; then
            echo "❌ DMG file not found!"
            exit 1
          fi
          echo "✅ macOS build successful!"
          ls -lh dist/

  test-build-windows:
    name: Test Windows Build
    runs-on: windows-latest
    
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build React app
        run: npm run build
      
      - name: 🪟 Build Windows 64-bit
        run: npm run dist:win:x64 -- --publish never
      
      - name: ✅ Verify output
        run: |
          if (!(Test-Path dist/*.exe)) {
            Write-Host "❌ EXE file not found!"
            exit 1
          }
          Write-Host "✅ Windows build successful!"
          Get-ChildItem dist/
