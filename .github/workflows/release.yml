name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/latest-mac.yml

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run dist:win:x64 -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-win]
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: dist-assets/release-mac
      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: dist-assets/release-win
      - name: Prepare release files
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-files

          cp "dist-assets/release-mac/HRS Desktop-${VERSION}-arm64.dmg" "release-files/HRS-Desktop-${VERSION}-arm64.dmg"
          cp "dist-assets/release-mac/HRS Desktop-${VERSION}.dmg" "release-files/HRS-Desktop-${VERSION}.dmg"
          cp "dist-assets/release-mac/HRS Desktop-${VERSION}-arm64-mac.zip" "release-files/HRS-Desktop-${VERSION}-arm64-mac.zip"
          cp "dist-assets/release-mac/HRS Desktop-${VERSION}-mac.zip" "release-files/HRS-Desktop-${VERSION}-mac.zip"
          cp "dist-assets/release-mac/latest-mac.yml" "release-files/latest-mac.yml"

          cp "dist-assets/release-win/HRS Desktop Setup ${VERSION}.exe" "release-files/HRS-Desktop-Setup-${VERSION}.exe"
          if [[ -f "dist-assets/release-win/HRS Desktop Setup ${VERSION}.exe.blockmap" ]]; then
            cp "dist-assets/release-win/HRS Desktop Setup ${VERSION}.exe.blockmap" "release-files/HRS-Desktop-Setup-${VERSION}.exe.blockmap"
          fi
          if [[ -f "dist-assets/release-win/HRS Desktop-${VERSION}-portable.exe" ]]; then
            cp "dist-assets/release-win/HRS Desktop-${VERSION}-portable.exe" "release-files/HRS-Desktop-${VERSION}-portable.exe"
          fi
          cp "dist-assets/release-win/latest.yml" "release-files/latest.yml"
          if [[ -f CHANGELOG.md ]]; then
            awk "/^## ${VERSION}$/{flag=1; print; next} /^## /{flag=0} flag" CHANGELOG.md > "release-files/CHANGELOG-${VERSION}.md"
          fi

          ls -lah release-files
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-files/CHANGELOG-${VERSION}.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            printf "## %s\n\n- Automated release.\n" "$GITHUB_REF_NAME" > "$NOTES_FILE"
          fi
          gh release view "$GITHUB_REF_NAME" -R "$GH_REPO" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" -R "$GH_REPO" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          gh release edit "$GITHUB_REF_NAME" -R "$GH_REPO" --notes-file "$NOTES_FILE"
      - name: Keep only required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ALLOWED=(
            "HRS-Desktop-${VERSION}-arm64.dmg"
            "HRS-Desktop-${VERSION}.dmg"
            "HRS-Desktop-Setup-${VERSION}.exe"
            "HRS-Desktop-Setup-${VERSION}.exe.blockmap"
            "HRS-Desktop-${VERSION}-portable.exe"
            "HRS-Desktop-${VERSION}-arm64-mac.zip"
            "HRS-Desktop-${VERSION}-mac.zip"
            "CHANGELOG-${VERSION}.md"
            "latest-mac.yml"
            "latest.yml"
          )
          mapfile -t CURRENT < <(gh release view "$GITHUB_REF_NAME" -R "$GH_REPO" --json assets -q '.assets[].name')
          for name in "${CURRENT[@]}"; do
            keep=0
            for allowed in "${ALLOWED[@]}"; do
              if [[ "$name" == "$allowed" ]]; then
                keep=1
                break
              fi
            done
            if [[ $keep -eq 0 ]]; then
              gh release delete-asset "$GITHUB_REF_NAME" "$name" -R "$GH_REPO" -y
            fi
          done
      - name: Upload required assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release-files/* -R "$GH_REPO" --clobber
